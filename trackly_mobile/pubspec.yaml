name: trackly
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  
  flutter_localizations:
    sdk: flutter

  intl: any

  cupertino_icons: ^1.0.8

  # App
  gap: ^3.0.1
  cached_network_image: ^3.4.1
  flutter_material_design_icons: ^1.1.7447

  flutter_riverpod: ^3.1.0
  hooks_riverpod: ^3.1.0
  flutter_hooks: ^0.21.3+1

  go_router: ^17.0.1

  get_storage: ^2.1.1

  dartz: ^0.10.1
  connectivity_plus: ^7.0.0
  dio: ^5.9.1

  dart_jsonwebtoken: ^3.3.1
  image_picker: ^0.8.7+4

  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  mobile_scanner: ^7.2.0
  location: ^8.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^6.0.0



flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/videos/
    - assets/fonts/
    - assets/audios/
